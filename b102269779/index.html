ps://www.google.com/maps/search/?api=1&query=Skaland%20Senja", "remark": "Optional · Village by Bergsfjord. ~30 min", "link": "", "pin": [69.40308, 17.50754]}, {"time": "", "type": "玩", "title": "[optional] Bøvær", "map": "https://www.google.com/maps/search/?api=1&query=B%C3%B8v%C3%A6r%20Senja", "remark": "Optional · Beach at the end of the road. ~45 min", "link": "", "pin": [69.46626, 17.22925]}, {"time": "", "type": "玩", "title": "Ersfjord beach", "map": "https://www.google.com/maps/search/?api=1&query=Ersfjordstranda%20Senja", "remark": "~30 min", "link": "", "pin": [69.47886, 17.39462]}, {"time": "", "type": "玩", "title": "Tungeneset", "map": "https://www.google.com/maps/search/?api=1&query=Tungeneset%20Senja", "remark": "Boardwalk facing Okshornan. Optional: stay into the evening for midnight sun if clear (then a late start on D12)", "link": "", "pin": [69.48695, 17.33304]}, {"time": "", "type": "車", "title": "Drive · Tungeneset → Senjahopen", "map": "https://www.google.com/maps/dir/?api=1&origin=Tungeneset&destination=Senjahopen&travelmode=driving", "remark": "~30 min", "link": "", "pin": null}, {"time": "", "type": "住", "title": "Hotel [Northern Senja – to book]", "map": "https://www.google.com/maps/search/?api=1&query=Senjahopen", "remark": "Night 3", "link": "", "pin": [69.49588, 17.48599]}]}, {"label": "D12", "date": "2027-06-16 (Wed)", "theme": "Buffer · pack", "items": [{"time": "", "type": "玩", "title": "Weather buffer", "map": "", "remark": "Hesten backup, or anything missed on D9–D11. Later start if last night was a midnight-sun evening", "link": "", "pin": null}, {"time": "", "type": "住", "title": "Hotel [Northern Senja – to book]", "map": "https://www.google.com/maps/search/?api=1&query=Senjahopen", "remark": "Night 4 · pack. If the Jun 17 flight leaves before ~12:00, spend this night near Evenes instead", "link": "", "pin": [69.49588, 17.48599]}]}, {"label": "D13", "date": "2027-06-17 (Thu)", "theme": "Senja-Evenes-Stockholm", "items": [{"time": "", "type": "車", "title": "Drive · Senjahopen → Evenes Airport", "map": "https://www.google.com/maps/dir/?api=1&origin=Senjahopen&destination=Harstad/Narvik%20lufthavn%20Evenes&travelmode=driving", "remark": "~4–4.5 h via Finnsnes. Leave ~8 h before takeoff. Refuel near the airport", "link": "", "pin": null}, {"time": "", "type": "車", "title": "Rental car · return at Evenes Airport", "map": "", "remark": "Check return-desk hours", "link": "", "pin": null}, {"time": "", "type": "飛", "title": "Flight EVE -OSL", "map": "", "remark": "To book for three · one ticket through to Stockholm", "link": "", "pin": null}, {"time": "", "type": "飛", "title": "Flight OSL -ARN", "map": "", "remark": "Pick a connection with a later OSL -ARN flight the same day as backup", "link": "", "pin": null}, {"time": "", "type": "住", "title": "Hotel [Stockholm – to book]", "map": "https://www.google.com/maps/search/?api=1&query=Stockholm%20Centralstation", "remark": "3 nights (Jun 17–20)", "link": "", "pin": [59.33015, 18.05821]}]}], "built": "2026-11-28 19:27"};
const MOVE = new Set(["飛","車","船","行"]);  // transport types; other types are cards
const tag = t => t ? `<span class="tag">[${esc(t)}]</span>` : "";
const COLORS = ["#e8742c","#2f80ed","#27ae60","#9b51e0","#eb5757","#f2c94c","#00a3a3","#bb6bd9"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const url = s => /^https?:\/\//.test(s) ? esc(s) : "";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

document.title = DATA.title;
document.getElementById("title").textContent = DATA.title;
document.getElementById("foot").textContent = "Updated " + DATA.built;

// If the map library cannot load (offline, blocked), show the itinerary without the map.
const HAS_MAP = typeof L !== "undefined";
if (!HAS_MAP) document.getElementById("map").style.display = "none";
const map = HAS_MAP ? L.map("map", { zoomControl:true }) : null;
if (HAS_MAP) L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
let layer = HAS_MAP ? L.layerGroup().addTo(map) : null;
const icon = (n, color) => L.divIcon({ className:"", html:`<div class="pin" style="background:${color}">${n}</div>`, iconSize:[26,26], iconAnchor:[13,13] });

function draw(points, color, label) {
  // points: [[lat,lng,title], ...]
  if (!HAS_MAP || !points.length) return [];
  L.polyline(points.map(p => [p[0], p[1]]), { color, weight:3, opacity:.7 }).addTo(layer);
  points.forEach((p, i) => L.marker([p[0], p[1]], { icon: icon(label ? label(i) : i + 1, color) }).bindPopup(esc(p[2])).addTo(layer));
  return points.map(p => [p[0], p[1]]);
}
function fit(all) {
  if (!HAS_MAP) return;
  if (all.length > 1) map.fitBounds(all, { padding:[24,24] });
  else if (all.length === 1) map.setView(all[0], 15);
  else map.setView([35, 135], 4);
}
// One pin per place per day: the same hotel twice in a day shows once.
function dayPins(d) {
  const seen = new Set(), out = [];
  d.items.forEach(it => { if (it.pin) { const k = it.pin.join(); if (!seen.has(k)) { seen.add(k); out.push([it.pin[0], it.pin[1], it.title, it]); } } });
  return out;
}

function tabs(active) {
  const nav = document.getElementById("tabs");
  nav.innerHTML = `<button data-i="-1"><b>Overview</b><small>&nbsp;</small></button>` +
    DATA.days.map((d, i) => `<button data-i="${i}"><b>${esc(d.label)}</b><small>${esc(String(d.date).replace(/^\d{4}-(\d\d)-(\d\d)/, (_, mo, da) => `${+da}/${+mo}`))}</small></button>`).join("");
  nav.querySelectorAll("button").forEach(b => { b.classList.toggle("on", +b.dataset.i === active); b.onclick = () => show(+b.dataset.i); });
  nav.querySelector(".on")?.scrollIntoView({ inline:"center", block:"nearest" });
}

function overview() {
  let all = [];
  // Overview: every pin shows its day number, in that day's colour.
  DATA.days.forEach((d, i) => { all = all.concat(draw(dayPins(d), COLORS[i % COLORS.length], () => i + 1)); });
  fit(all);
  return DATA.days.map((d, i) => `<a class="day" data-i="${i}"><b style="color:${COLORS[i % COLORS.length]}">${esc(d.label)}</b>${esc(d.date)}<div class="rem">${esc(d.theme)}</div></a>`).join("");
}

function day(i) {
  const d = DATA.days[i], pins = dayPins(d), num = new Map();
  pins.forEach((p, n) => num.set(p[3].pin.join(), n + 1));
  fit(draw(pins, COLORS[0]));
  let h = `<h2><span>${esc(d.label)}</span>${esc(d.theme)}</h2>`;
  d.items.forEach(it => {
    const links = `${url(it.map) ? `<a href="${url(it.map)}" target="_blank" rel="noopener">${MOVE.has(it.type) ? "Route" : "Map"}</a>` : ""}${url(it.link) ? `<a href="${url(it.link)}" target="_blank" rel="noopener">${MOVE.has(it.type) ? "Timetable" : "Website"}</a>` : ""}`;
    if (MOVE.has(it.type) && !it.pin) {
      h += `<div class="move"><div class="time">${esc(it.time)}</div><div class="m">${tag(it.type)}${esc(it.title)}${it.remark ? `<div class="rem">${esc(it.remark)}</div>` : ""}${links ? `<div class="acts">${links}</div>` : ""}</div></div>`;
    } else {
      const n = it.pin ? num.get(it.pin.join()) : null;
      h += `<div class="row"><div class="time">${esc(it.time)}</div><div class="card"><div class="t">${n ? `<span class="num">${n}</span>` : ""}${tag(it.type)}${esc(it.title)}</div>${it.remark ? `<div class="rem">${esc(it.remark)}</div>` : ""}${links ? `<div class="acts">${links}</div>` : ""}</div></div>`;
    }
  });
  return h;
}

function show(i) {
  if (HAS_MAP) layer.clearLayers();
  const body = document.getElementById("body");
  body.innerHTML = i < 0 ? overview() : day(i);
  body.querySelectorAll(".day").forEach(a => a.onclick = () => show(+a.dataset.i));
  tabs(i);
  store.set("tab:" + DATA.title, i);
  window.scrollTo(0, 0);
}

const today = new Date().toISOString().slice(0, 10);
const t = DATA.days.findIndex(d => String(d.date).startsWith(today));
const saved = store.get("tab:" + DATA.title);
show(t >= 0 ? t : (saved !== null && +saved < DATA.days.length ? +saved : -1));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
